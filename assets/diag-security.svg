<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" rx="12" fill="url(#bg-sec)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Shield in center -->
  <g transform="translate(240, 110)">
    <!-- Outer glow circle -->
    <circle r="44" fill="rgba(99, 102, 241, 0.12)" stroke="#6366f1" stroke-width="1.5"/>
    <!-- Lock / Shield path -->
    <path d="M -18 -10 L 0 -22 L 18 -10 L 18 12 C 18 24 0 32 0 32 C 0 32 -18 24 -18 12 Z" fill="#4f46e5" stroke="#818cf8" stroke-width="2"/>
    <circle cx="0" cy="2" r="3.5" fill="#fff"/>
    <path d="M 0 5.5 L 0 13" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Left: Peer A -->
  <g transform="translate(70, 90)">
    <rect width="96" height="60" rx="8" fill="#141417" stroke="#333338"/>
    <text x="48" y="26" fill="#f4f4f5" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">Server A</text>
    <text x="48" y="44" fill="#22c55e" font-size="10" font-family="monospace" text-anchor="middle">TLS Client</text>
  </g>
  <path d="M 172 120 L 190 120" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Right: Peer B -->
  <g transform="translate(314, 90)">
    <rect width="96" height="60" rx="8" fill="#141417" stroke="#333338"/>
    <text x="48" y="26" fill="#f4f4f5" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">Server B</text>
    <text x="48" y="44" fill="#22c55e" font-size="10" font-family="monospace" text-anchor="middle">TLS Server</text>
  </g>
  <path d="M 290 120 L 308 120" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Top description -->
  <text x="240" y="40" fill="#c7d2fe" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">
    Standard HTTPS / TLS Channel + Ed25519 S2S Signatures
  </text>
  <!-- Bottom note -->
  <text x="240" y="200" fill="#71717a" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    Automatic TLS via Caddy edge · Zero plain-text leaks across public networks
  </text>
</svg>
