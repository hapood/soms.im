<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-res" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" rx="12" fill="url(#bg-res)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Server container card -->
  <rect x="36" y="40" width="408" height="180" rx="10" fill="#141417" stroke="#27272a"/>
  
  <!-- Header bar -->
  <rect x="36" y="40" width="408" height="32" rx="10" fill="#1f1f23"/>
  <circle cx="56" cy="56" r="4" fill="#ef4444"/>
  <circle cx="70" cy="56" r="4" fill="#eab308"/>
  <circle cx="84" cy="56" r="4" fill="#22c55e"/>
  <text x="240" y="61" fill="#a1a1aa" font-size="11" font-family="monospace" text-anchor="middle">soms-backend / runtime monitor</text>

  <!-- Metric 1: RAM gauge -->
  <g transform="translate(64, 96)">
    <rect width="160" height="96" rx="8" fill="#18181b" stroke="#333338"/>
    <text x="16" y="26" fill="#71717a" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">RAM USAGE</text>
    <text x="16" y="60" fill="#22c55e" font-size="28" font-family="monospace" font-weight="700">~200 <tspan font-size="14" fill="#a1a1aa">MB</tspan></text>
    <text x="16" y="80" fill="#a1a1aa" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Active server process</text>
  </g>

  <!-- Metric 2: Components -->
  <g transform="translate(244, 96)">
    <rect width="172" height="96" rx="8" fill="#18181b" stroke="#333338"/>
    <text x="16" y="26" fill="#71717a" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">ARCHITECTURE</text>
    <text x="16" y="52" fill="#818cf8" font-size="13" font-family="monospace" font-weight="600">✓ Fastify Server</text>
    <text x="16" y="70" fill="#818cf8" font-size="13" font-family="monospace" font-weight="600">✓ PostgreSQL</text>
    <text x="16" y="88" fill="#71717a" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">No Redis / No Kafka</text>
  </g>
</svg>
