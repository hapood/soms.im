<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" rx="12" fill="url(#bg-plat)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Center Shared Engine: Rust Core -->
  <g transform="translate(140, 150)">
    <rect width="200" height="64" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="100" y="28" fill="#c7d2fe" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">Shared Rust Runtime</text>
    <text x="100" y="48" fill="#a1a1aa" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Crypto · State · Local Sync</text>
  </g>

  <!-- 4 Platform Badges radiating above -->
  <!-- Web -->
  <g transform="translate(40, 50)">
    <rect width="84" height="54" rx="8" fill="#141417" stroke="#333338"/>
    <text x="42" y="24" fill="#f4f4f5" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">Web / PWA</text>
    <text x="42" y="42" fill="#22c55e" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Angular</text>
  </g>
  <path d="M 90 108 L 170 150" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Android -->
  <g transform="translate(144, 50)">
    <rect width="84" height="54" rx="8" fill="#141417" stroke="#333338"/>
    <text x="42" y="24" fill="#f4f4f5" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">Android</text>
    <text x="42" y="42" fill="#22c55e" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">~34MB APK</text>
  </g>
  <path d="M 186 108 L 210 150" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Linux & macOS -->
  <g transform="translate(252, 50)">
    <rect width="84" height="54" rx="8" fill="#141417" stroke="#333338"/>
    <text x="42" y="24" fill="#f4f4f5" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">Desktop</text>
    <text x="42" y="42" fill="#22c55e" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Linux / macOS</text>
  </g>
  <path d="M 294 108 L 270 150" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Windows -->
  <g transform="translate(356, 50)">
    <rect width="84" height="54" rx="8" fill="#141417" stroke="#333338"/>
    <text x="42" y="24" fill="#f4f4f5" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">Windows</text>
    <text x="42" y="42" fill="#22c55e" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Native MSI/EXE</text>
  </g>
  <path d="M 390 108 L 310 150" stroke="#3f3f46" stroke-width="1.5"/>

  <text x="240" y="235" fill="#71717a" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    Lean native clients share one battle-tested core · (iOS currently not supported)
  </text>
</svg>
